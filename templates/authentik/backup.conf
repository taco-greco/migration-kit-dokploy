APP_NAME=authentik
DB_TYPE=postgres
DB_CONTAINER=authentik-postgresql-1   # adjust to match `docker ps` name on the source host
DB_NAME=authentik
DB_USER=authentik
VOLUMES=(authentik-media authentik-templates authentik-certs)
# authentik-database (the Postgres data dir) is intentionally NOT tarred.
# It is handled exclusively via the pg_dump/psql logical dump above — do not
# restore a raw copy of it onto a freshly-initialized Postgres container,
# that's the failure mode reported in the authentik migration GitHub issue
# referenced in lib-backup-restore.sh.
