APP_NAME=nextcloud
DB_TYPE=mysql
DB_CONTAINER=nextcloud-db-1   # adjust to match `docker ps` name on the source host
DB_NAME=nextcloud
DB_USER=nextcloud
# nextcloud-html is usually skippable (it's just the app code, re-pulled from
# the image) but nextcloud-data is the actual user files and is the one that
# matters. Given you said "even if we don't manage to get the DB or anything
# it's still okay" for nextcloud, treat nextcloud-data as the only must-have.
VOLUMES=(nextcloud-data)
