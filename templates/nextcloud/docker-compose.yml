# ============================================================================
# Nextcloud — based on the official docker-compose layout
# (nextcloud + mariadb, named volumes for data/db/config).
# ============================================================================
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - nextcloud-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASS}
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASS}
      MYSQL_DATABASE: ${NEXTCLOUD_DB_NAME:-nextcloud}
      MYSQL_USER: ${NEXTCLOUD_DB_USER:-nextcloud}

  app:
    image: nextcloud:30-apache
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - nextcloud-html:/var/www/html
      - nextcloud-data:/var/www/html/data
    environment:
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASS}
      MYSQL_DATABASE: ${NEXTCLOUD_DB_NAME:-nextcloud}
      MYSQL_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      MYSQL_HOST: db
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_HOST}
    ports:
      - "8081:80"

volumes:
  nextcloud-db:
  nextcloud-html:
  nextcloud-data:
